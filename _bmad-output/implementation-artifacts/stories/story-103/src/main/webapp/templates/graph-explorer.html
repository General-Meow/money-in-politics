<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relationship Graph Explorer - Money in Politics</title>

  <!-- React and ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- D3.js for graph visualization -->
  <script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>

  <!-- Babel for JSX compilation in browser (development) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Graph Explorer CSS -->
  <link rel="stylesheet" href="/webjars/react/18.2.0/dist/cdn.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/graph-explorer.css">

  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1rem; }
  </style>
</head>
<body>
  <div id="root" class="container"></div>

  <script type="text/babel">
    const { h, Fragment, useEffect, useState } = React;

    // Sample Data (would come from backend API)
    const sampleNodes = [
      { id: 'UK-CHS-LAB', label: 'Keir Starmer', entityType: 'Politician', r: 20 },
      { id: 'COMP-BL-001', label: 'BL plc', entityType: 'Company', r: 18 },
      { id: 'UK-SUS-LAB', label: 'Susanne Starmer', entityType: 'Politician', r: 16 },
      { id: 'UK-LAB-PARTY', label: 'Labour Party', entityType: 'Party', r: 15 }
    ];

    const sampleLinks = [
      { source: 0, target: 2, relationshipType: 'spouse' },
      { source: 0, target: 3, relationshipType: 'member_of' },
      { source: 0, target: 1, relationshipType: 'works_at' }
    ];

    const App = () => {
      // Force simulation for node positions (D3)
      const [simulation] = useState(() => {
        return d3.forceSimulation()
          .force('link', d3.forceLink().id(d => d.id).distance(100))
          .force('charge', d3.forceManyBody().strength(-200))
          .force('center', d3.forceCenter(400, 300));
      });

      useEffect(() => {
        // Attach force positions to nodes
        sampleNodes.forEach((node, i) => {
          const datum = { ...node, index: i };
          simulation.node(datum);
          simulation.force('link').links(sampleLinks.map(link => ({ source: sampleNodes[link.source], target: sampleNodes[link.target] })));
          
          // Update positions
          d3.timer(() => {
            if (simulation.alpha < 0.01) return;
            
            // Simple collision detection and spacing
            const nodes = simulation.nodes();
            const links = simulation.links();
            
            // Recalculate link positions
            simulation.on("tick", () => {
              sampleNodes.forEach(node => {
                // Update node position from simulation
                const datum = simulation.find(n => n === node);
                if (datum) {
                  console.log('Node position:', datum.x, datum.y);
                }
              });
            });
          });
        });
      }, []);

      return h(
        'div',
        null,
        [
          // Graph visualization would be rendered here with D3
          h('svg', { 
            width: '100%', 
            height: 600,
            viewBox: '0 0 800 600'
          }, null)
        ]
      );
    };

    const rootElement = document.getElementById('root');
    const container = { current: null };
    
    ReactDOM.createRoot(rootElement).render(h(Fragment, null, h(App)));
  </script>
</body>
</html>
