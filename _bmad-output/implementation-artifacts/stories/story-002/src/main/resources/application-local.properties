# STORY-002 Parliament.uk API Local Development Configuration

# Base URL for Parliament.uk API
parliament.base-url=https://services.parliament.uk/develop/api/v3.1

# OAuth/OIDC Configuration (set to false when using public API without auth)
parliament.oauth-enabled=false

# TODO: When OAuth credentials available, uncomment and configure:
# parliament.client-id=xxx-your-client-id-xxx
# parliament.client-secret=xxx-your-client-secret-xxx

# Rate limiting settings
parliament.max-retries=3
parliament.retry-delay-milliseconds=2000

# Debug logging (for development/testing)
logging.level.com.webofpolitics.api=DEBUG
