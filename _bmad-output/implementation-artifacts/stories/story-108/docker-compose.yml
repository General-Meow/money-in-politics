# STORY-108: Production Deployment - Docker Compose Configuration
services:
  # Neo4j Graph Database (EPIC-01 data layer)
  neo4j:
    image: neo4j:5.24
    ports:
      - "7474:7474"  # Browser access
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4DB_MODE=standalone
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - web-of-politics

  # Java Application Container (EPIC-01 + EPIC-02 + EPIC-03)
  app:
    image: openjdk:25-jre-slim
    working_dir: /app
    command: ["java", "-jar", "webofpolitics-integration.jar"]
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
    volumes:
      - ./data:/app/data

  # Node.js for D3 Graph Explorer (EPIC-03 frontend)
  node:
    image: node:22-alpine
    ports:
      - "8081:8081"
    working_dir: /app
    command: ["npm", "start"]

networks:
  web-of-politics:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:

