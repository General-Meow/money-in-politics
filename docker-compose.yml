# Docker Compose - The Web of Politics Microservices Architecture
# Services: API Backend, Frontend Application, Neo4j Graph Database

version: '3.8'

services:
  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5.17-latest
    container_name: web-of-politics-neo4j
    ports:
      - "7474:7474"   # Browser access
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
      - ./web-of-politics-api/src/main/resources/db/:/var/lib/neo4j/import  # Migration scripts if needed
    networks:
      - web-of-politics-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Backend Service (Spring Boot)
  api:
    build: ./web-of-politics-api/
    container_name: web-of-politics-api
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=neo4j123
      - SERVER_PORT=8080
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - web-of-politics-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend Service (React + Nginx)
  frontend:
    build: ./web-of-politics-frontend/
    container_name: web-of-politics-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web-of-politics-network

# Named volumes for Neo4j persistence
volumes:
  neo4j-data:

# Default network for inter-service communication
networks:
  web-of-politics-network:
    driver: bridge
