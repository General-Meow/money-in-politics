# EPIC-01 Foundation Integration Testing Environment
# Docker Compose for Neo4j, PostgreSQL, Redis

version: '3.8'

services:
  # Neo4j - Graph Database (Primary storage)
  neo4j:
    image: neo4j:5.17-community
    container_name: webofpolitics_neo4j
    environment:
      - NEO4J_AUTH=neo4j/secret
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - /home/paul/dev/projects/money-in-politics/_bmad-output/implementation-artifacts/stories/story-001/docker-entrypoint-initdb.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - webofpolitics-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -q localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL - Relational database (for fallback/auxiliary storage)
  postgresql:
    image: postgres:16-alpine
    container_name: webofpolitics_postgresql
    environment:
      - POSTGRES_USER=webofpolitics
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=web_of_politics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webofpolitics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webofpolitics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching layer (for API responses)
  redis:
    image: redis:7-alpine
    container_name: webofpolitics_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - webofpolitics-net
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

networks:
  webofpolitics-net:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data:
  redis_data:

# Services are ready for EPIC-01 validation:
# - STORY-001 (Neo4j Schema): Graph nodes/edges tested with live Neo4j instance
# - STORY-002 (Parliament API): Can integrate with Neo4j after schema initialization
# - STORY-003 (Electoral Commission API): Donation data mapped to Neo4j graph
# - STORY-004 (Companies House API): Company data integrated into graph
